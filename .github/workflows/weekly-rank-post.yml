name: weekly-rank-post

on:
  schedule:
    - cron: '0 1 * * 4'  # Every Thursday 01:00 UTC = 09:00 台北 (GMT+8)
  workflow_dispatch:      # Allow manual trigger

jobs:
  send-rank-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate and send rank post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd agents/marketing-op
          python3 generate-rank-post.py > /tmp/message.txt
          cat /tmp/message.txt
          python3 - <<'EOF'
          import os, sys, urllib.request, json

          import re

          with open('/tmp/message.txt', 'r') as f:
              text = f.read().strip()

          # 保险丝：脚本的日志一律走 stderr，stdout 只该有文案。
          # 万一有日志漏进来（或文案是空的），宁可不发，也不要发出脏贴文。
          if not text:
              print('❌ 文案为空，中止发送')
              sys.exit(1)
          if not text.startswith('💸') or any(
              m in text for m in ('✅ 自动登录', '⚠️', '❌', 'Traceback')
          ):
              print('❌ 侦测到日志混入文案，中止发送')
              print(text[:500])
              sys.exit(1)

          # Convert Markdown [text](url) links to HTML <a href="url">text</a>
          def md_to_html(t):
              # Escape HTML special chars first (excluding already-converted links)
              t = t.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')
              # Convert [text](url) to HTML links
              t = re.sub(r'\[([^\]]+)\]\(([^)]+)\)', r'<a href="\2">\1</a>', t)
              return t

          text = md_to_html(text)

          token = os.environ['TELEGRAM_BOT_TOKEN']
          chat_id = os.environ['TELEGRAM_CHAT_ID']

          data = json.dumps({
              'chat_id': chat_id,
              'text': text,
              'parse_mode': 'HTML',
              'disable_web_page_preview': True
          }).encode('utf-8')

          req = urllib.request.Request(
              f'https://api.telegram.org/bot{token}/sendMessage',
              data=data,
              headers={'Content-Type': 'application/json; charset=utf-8'}
          )
          resp = urllib.request.urlopen(req)
          result = json.loads(resp.read())
          print(f"✅ Sent: message_id={result['result']['message_id']}")
          EOF
